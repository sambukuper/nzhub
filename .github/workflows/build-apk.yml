name: build apk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NZHUB_KEYSTORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.NZHUB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nzhub.keystore"
            export KEYSTORE="$RUNNER_TEMP/nzhub.keystore"
          fi
          bash tools/ci_build.sh "$RUNNER_TEMP/NZHub.apk"
          cp "$RUNNER_TEMP/NZHub.apk" NZHub.apk
          sha256sum NZHub.apk > NZHub.apk.sha256
          rm -f "$RUNNER_TEMP/nzhub.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: NZHub-apk
          path: |
            NZHub.apk
            NZHub.apk.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp NZHub.apk "NZHub-$VERSION.apk"
          cp NZHub.apk NZHub-latest.apk
          sha256sum NZHub-latest.apk > NZHub-latest.apk.sha256
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NZHub $VERSION" \
            --notes-file CHANGELOG.md \
            "NZHub-$VERSION.apk" NZHub-latest.apk "NZHub-$VERSION.apk.sha256"
